<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OCI Compute Flex Shapes multicore benchmark</title>
  <desc id="desc">A benchmark chart comparing AMD, Intel and Ampere OCI Compute Flex Shapes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="70" y="70" width="1060" height="490" rx="30" fill="#f8fafc"/>
